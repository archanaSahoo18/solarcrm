# ===============================
# DATABASE CONFIGURATION
# ===============================
# Use Render's URL if available, otherwise fallback to local postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solarcrm_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL specific dialect for Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===============================
# SERVER & SECURITY
# ===============================
server.port=${PORT:8080}
app.jwt.secret=${APP_JWT_SECRET:MySuperSecretKeyForSolarCrmProject1234567890}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}